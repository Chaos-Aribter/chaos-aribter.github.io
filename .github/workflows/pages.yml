name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules run in UTC. Refresh every 30 minutes.
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh EVE statistics cache
        run: python3 scripts/refresh_remote_stats.py
        # Third-party ESI/zKillboard outages must not block a site deployment:
        # the checked-in cache remains available until the next successful run.
        continue-on-error: true
      - name: Commit refreshed cache
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- public/data/remote-stats.json; then
            echo "Statistics unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/remote-stats.json
          git commit -m "chore: refresh EVE statistics cache"
          git push

  deploy:
    needs: refresh-stats
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      # GitHub Pages replaces the complete artifact on every deploy.  An edge
      # cache can still return the previous index.html for a short time,
      # however, and that document references the previous hashed _next
      # assets.  Keep the previous assets in a small history branch and merge
      # them into the new artifact so an old document never becomes unstyled.
      - name: Restore compatible static assets
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin pages-static-history:refs/remotes/origin/pages-static-history || true
          if git rev-parse --verify --quiet origin/pages-static-history; then
            mkdir -p .pages-static-history
            git archive origin/pages-static-history | tar -x -C .pages-static-history
            if [ -d .pages-static-history/static ]; then
              cp -R .pages-static-history/static/. out/_next/static/
            fi
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      # Persist this build's hashed assets for the following deployment.  This
      # branch is not a Pages source and does not trigger this workflow.
      - name: Archive static assets for the next release
        shell: bash
        run: |
          set -euo pipefail
          history_dir="$RUNNER_TEMP/pages-static-history"
          git worktree add --detach "$history_dir" origin/pages-static-history
          mkdir -p "$history_dir/static"
          cp -R out/_next/static/. "$history_dir/static/"
          git -C "$history_dir" add static
          if ! git -C "$history_dir" diff --cached --quiet; then
            git -C "$history_dir" config user.name "github-actions[bot]"
            git -C "$history_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$history_dir" commit -m "chore: preserve Pages static assets"
            git -C "$history_dir" push origin HEAD:pages-static-history
          fi
          git worktree remove --force "$history_dir"
